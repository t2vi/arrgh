# *ARRgh server (ADR 0033) — sole backend as of S10 (#132); the .NET
# project that used to share this directory is gone.
#
# ponytail: single crate (lib + bin), not the ADR's floated arrgh-core /
# arrgh-metadata workspace split — no reuse target outside this binary ever
# showed up across S0-S9. Revisit if a second consumer does.
[package]
name = "arrgh-server"
version = "1.1.0"          # single source of truth for GET /api/version
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "arrgh-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
jsonwebtoken = "9"
time = { version = "0.3", features = ["formatting", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
# rustls, not native-tls/openssl — keeps the static-binary goal (ADR 0033).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
futures = "0.3"
# default-features off — CBZ pages are written Stored (no compression),
# matching .NET's `CompressionLevel.NoCompression`; no deflate/bzip2/aes
# backend needed.
zip = { version = "2", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
