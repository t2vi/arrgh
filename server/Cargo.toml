# *ARRgh server — Rust rewrite (ADR 0033), strangler-fig alongside the .NET
# project in this same directory. `cargo` only sees Rust files; `dotnet` only
# sees .cs. At S10 (#132) the .NET files are deleted and this stays.
#
# ponytail: single crate for now (lib + bin). The ADR's arrgh-core /
# arrgh-metadata split lands when there's actually a second crate's worth of
# code to move (S4 / S6), not before.
[package]
name = "arrgh-server"
version = "0.1.7"          # single source of truth for GET /api/version
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "arrgh-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
