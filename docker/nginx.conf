server {
    listen 8080;
    server_name _;

    root /var/www/arrgh;
    index index.html;

    # All /api/* → the Rust server (ADR 0033, S10 #132 cutover — the
    # .NET server and its per-prefix strangler-fig routing are gone).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 0;
    }

    # Never cache index.html — ensures browser fetches fresh bundle references on deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
