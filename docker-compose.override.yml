services:
  arrgh:
    build: .
    volumes:
      - ./web-svelte/dist:/var/www/arrgh:ro   # dev: serve local build without image rebuild

  plugin-host:
    build:
      context: .
      dockerfile: plugin-host/Dockerfile

  cloakbrowser:
    platform: linux/amd64
    build:
      context: docker/cloakbrowser-server
      dockerfile: Dockerfile
    ports:
      - "3002:3000"   # not 3001 — collides with the Rust dev server's own RUST_BIND default
